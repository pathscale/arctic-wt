[package]
name = "arctic-wt"
version = "0.1.11"
edition = "2024"
description = "Lock-free adaptive radix tree"
repository = "https://github.com/pathscale/arctic-wt"
license = "MIT OR Apache-2.0"
keywords = ["lock-free", "concurrent", "radix-tree", "map", "index"]
categories = ["concurrency", "data-structures"]

[lib]
name = "arctic"
path = "src/lib.rs"

[features]
default = ["std", "smr-ps-reclaim"]

# Off, this crate does not link `std`. What it costs: the reclamation backends
# that need an operating system. `NoOp` is always available and the others say
# for themselves.
std = ["fearless_simd/std", "ps-reclaim?/std"]

stat = ["dep:serde", "dep:base64", "dep:hdrhistogram"]
# The garbage counter batches per thread, and `thread_local!` is `std`.
stat-garbage = ["std"]
opt-no-node3-keys = []
opt-no-node3-iter = []
opt-no-node15-get = []
opt-no-node15-keys = []
opt-no-node15-iter = []
opt-no-node47-keys = []
opt-no-node47-iter = []
opt-no-prefix = []
opt-no-int = []
opt-no-expand = []
opt-membarrier = ["dep:libc", "seize/fast-barrier"]
opt-no-path = []
opt-no-dispatch = []

# The hazard backend keys two thread-locals off `thread_local!` and holds its
# free list in a `std::sync::Mutex`, in `smr/hazard/thread.rs`. Both have
# `no_std` answers and neither is written yet, so the feature carries the
# requirement rather than pretending otherwise.
smr-hazard = ["std"]
smr-epoch = ["dep:crossbeam-epoch"]
# ps-reclaim gained a `no_std` mode in 0.1.4, so this no longer drags `std` in
# with it. Ask for the platform pieces it needs without `std`; arctic's own
# `std` feature forwards `ps-reclaim/std` below, and `std` wins inside that
# crate when both are on.
smr-ps-reclaim = ["dep:ps-reclaim", "ps-reclaim/spin"]
smr-seize = ["dep:seize"]

validate = []

rand = ["dep:rand"]
shuttle = []
proptest = ["dep:proptest"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
crossbeam-epoch = { version = "0.9.18", optional = true }
hdrhistogram = { version = "7.5.4", optional = true, default-features = false, features = ["serialization"] }
libc = { version = "0.2.176", optional = true }
proptest = { version = "1.9.0", optional = true }
# The platform crate `ps-reclaim` needs with `std` off is per target: a
# `pthread_key_t` on unix, an `FlsAlloc` slot on Windows. Naming `libc` in the
# feature list picked the unix one everywhere, so a Windows build got neither
# `std` nor `windows-sys` and the `windows_sys::` calls had no crate behind
# them.
ps-reclaim = { version = "^0.1, >=0.1.4", optional = true, default-features = false }
ribbit = { version = "0.2.1", features = ["atomic-u128"] }
seize = { version = "0.5.1", optional = true }
serde = { version = "1.0.219", optional = true, features = ["derive"] }
rand = { version = "0.10.1", optional = true }
# `libm` unconditionally: without `std` this crate needs one of the two, and
# `libm` is pure Rust. Arctic never calls a float operation, so this is paying
# for a shape of the dependency rather than for anything on a path here.
# `force_support_fallback` because the `Fallback` variant and `Level::fallback`
# are compiled only when the target does not statically support something
# better. Without `std` there is no runtime detection to fall back *from*, so
# `detect` below names the variant directly and needs it to exist on every
# target, x86-64 CI runners included.
fearless_simd = { version = "0.6.0", default-features = false, features = [
    "libm",
    "force_support_fallback",
] }
# A `no_std` `Once` for the SIMD level, which `std::sync::LazyLock` used to hold.
spin = { version = "0.9", default-features = false, features = ["once"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
mimalloc = "0.1.50"
proptest-state-machine = "0.6.0"
shuttle = { git = "https://github.com/nwtnni/shuttle.git" }
shuttle-core = { git = "https://github.com/nwtnni/shuttle.git" }

[[bench]]
name = "sequential"
harness = false

[profile.release]
debug = true

[target.'cfg(unix)'.dependencies.ps-reclaim]
version = "^0.1, >=0.1.4"
optional = true
default-features = false
features = ["libc"]

[target.'cfg(windows)'.dependencies.ps-reclaim]
version = "^0.1, >=0.1.4"
optional = true
default-features = false
features = ["windows-sys"]
